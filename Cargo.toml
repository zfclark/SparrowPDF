[package]
name = "sparrowpdf"
version = "0.4.2"
edition = "2021"
rust-version = "1.95"
description = "轻雀 PDF —— 基于 Rust 的本地 PDF 工具箱"
publish = false

[lib]
name = "sparrowpdf"
path = "src/lib.rs"

[[bin]]
name = "sparrowpdf"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui = { version = "0.37", default-features = false }
egui_dnd = "0.18"
rfd = "0.17"
lopdf = "0.39"
medpdf = { version = "0.9.2", default-features = false }
medpdf-image = { version = "0.2.2", default-features = false }
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

allsorts = { version = "0.16", default-features = false, features = ["flate2_rust"] }

[build-dependencies]
# Embeds assets/app.ico into the Windows executable (taskbar / Explorer icon).
winresource = "0.1"

[profile.release]
# Unwinding is required so the worker thread can catch tool panics and turn
# them into visible, logged errors instead of crashing the whole app.
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
