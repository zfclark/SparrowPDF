name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout (tag ref)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          V="${{ github.event.inputs.tag || github.ref_name }}"
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V"

      - name: Tag format and manifest agreement
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag $TAG is not vX.Y.Z"; exit 1
          fi
          CARGO_V="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$CARGO_V" != "${TAG#v}" ]; then
            echo "::error::Cargo.toml version $CARGO_V != tag ${TAG#v}"; exit 1
          fi

      - name: Tag must be reachable from main
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
            echo "::error::$TAG is not reachable from main"; exit 1
          fi

  build-windows:
    needs: guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build release
        run: cargo build --release --locked

      - name: Strip check (no embedded debug sections)
        shell: pwsh
        run: |
          $exe = "target/release/sparrowpdf.exe"
          if (-not (Test-Path $exe)) { throw "exe missing" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $needle = [System.Text.Encoding]::ASCII.GetBytes(".debug_")
          for ($i = 0; $i -le $bytes.Length - $needle.Length; $i++) {
            $ok = $true
            for ($j = 0; $j -lt $needle.Length; $j++) {
              if ($bytes[$i + $j] -ne $needle[$j]) { $ok = $false; break }
            }
            if ($ok) { throw "embedded .debug_ section found in release exe" }
          }
          $mb = [math]::Round($bytes.Length / 1MB, 2)
          if ($bytes.Length -gt 20MB) { throw "exe is $mb MB, limit is 20 MB (before UPX)" }
          Write-Host "exe ok: $mb MB, no debug sections"

      - name: UPX compress (non-blocking)
        continue-on-error: true
        shell: pwsh
        run: |
          curl.exe -sSL -o upx.zip https://github.com/upx/upx/releases/download/v5.3.0/upx-5.3.0-win64.zip
          Expand-Archive upx.zip -DestinationPath upx
          & (Get-ChildItem upx -Recurse -Filter upx.exe).FullName --best target/release/sparrowpdf.exe
          $sz = (Get-Item target/release/sparrowpdf.exe).Length
          if ($sz -gt 12MB) { Write-Warning "exe is $([math]::Round($sz/1MB,2)) MB after UPX, above the 12 MB goal" }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SparrowPDF-windows-x64
          path: target/release/sparrowpdf.exe
          if-no-files-found: error

  build-macos:
    needs: guard
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build both slices
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          strip target/aarch64-apple-darwin/release/sparrowpdf
          strip target/x86_64-apple-darwin/release/sparrowpdf

      - name: Lipo into universal binary
        run: |
          mkdir -p universal
          lipo -create \
            target/aarch64-apple-darwin/release/sparrowpdf \
            target/x86_64-apple-darwin/release/sparrowpdf \
            -output universal/SparrowPDF
          ARCHS="$(lipo -archs universal/SparrowPDF)"
          echo "archs: $ARCHS"
          case "$ARCHS" in *x86_64*) ;; *) echo "::error::x86_64 slice missing"; exit 1;; esac
          case "$ARCHS" in *arm64*) ;; *) echo "::error::arm64 slice missing"; exit 1;; esac
          SZ=$(stat -f%z universal/SparrowPDF)
          if [ "$SZ" -gt $((25 * 1024 * 1024)) ]; then
            echo "::error::universal binary is $SZ bytes, limit 25 MB"; exit 1
          fi

      - name: Assemble SparrowPDF.app
        run: |
          V="${{ needs.guard.outputs.version }}"
          APP="SparrowPDF.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp universal/SparrowPDF "$APP/Contents/MacOS/SparrowPDF"
          cp assets/app.icns "$APP/Contents/Resources/app.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>轻雀 PDF</string>
            <key>CFBundleDisplayName</key><string>轻雀 PDF</string>
            <key>CFBundleExecutable</key><string>SparrowPDF</string>
            <key>CFBundleIconFile</key><string>app</string>
            <key>CFBundleIdentifier</key><string>com.sparrowpdf.app</string>
            <key>CFBundleVersion</key><string>$V</string>
            <key>CFBundleShortVersionString</key><string>$V</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSPrincipalClass</key><string>NSApplication</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
            <key>CFBundleDocumentTypes</key>
            <array>
              <dict>
                <key>CFBundleTypeName</key><string>PDF Document</string>
                <key>CFBundleTypeRole</key><string>Editor</string>
                <key>LSItemContentTypes</key>
                <array><string>com.adobe.pdf</string></array>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST
          codesign --force --sign - "$APP"

      - name: Build DMG
        run: |
          V="${{ needs.guard.outputs.version }}"
          mkdir -p dmgsrc
          cp -R SparrowPDF.app dmgsrc/
          hdiutil create -volname "SparrowPDF $V" -srcfolder dmgsrc -format UDZO \
            -o SparrowPDF-macos-universal.dmg 2>/dev/null || \
          hdiutil create -volname "SparrowPDF $V" -srcfolder dmgsrc -format UDZO \
            -fs APFS SparrowPDF-macos-universal.dmg
          ls -la SparrowPDF-macos-universal.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SparrowPDF-macos-universal
          path: SparrowPDF-macos-universal.dmg
          if-no-files-found: error

  publish:
    needs: [guard, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 轻雀 PDF ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/sparrowpdf.exe
            dist/SparrowPDF-macos-universal.dmg
