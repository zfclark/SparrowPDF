# 轻雀 PDF 发布流水线
#
# 触发
#   · 推 tag 自动运行：tag 必须是 V主.副.修订.YYYYMMDD，如 V0.5.1.20261106。
#   · 手动重跑某个 tag：gh workflow run release.yml --ref V0.5.1.20261106
#     （网页的 Run workflow 面板只能选分支，选不了 tag）。
#   · 版本号一律从 ref 现算，没有手工输入；非 tag 的 ref 在 guard 第一步失败。
#
# 产物
#   SparrowPDF-windows-x64.exe / SparrowPDF-windows-arm64.exe /
#   SparrowPDF-macos-universal.dmg。Release 说明取自 CHANGELOG 对应条目。
#
# 维护约束（工具链、矩阵重命名、macOS 打包、guard 职责、权限与免费版限额）
# 见 AGENTS.md 4.5 节。

name: 🚀 版本构建发布

on:
    push:
        tags: ["V[0-9]*.[0-9]*.[0-9]*.[0-9]*"]
    # 无输入：构建哪个版本，由运行在哪个 ref 上决定（用法见文件头「触发」）。
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    # 同一 tag 的两次运行串行，避免两条流水线同时建 Release。手动触发时
    # ref_name 就是所选的 tag，与推 tag 天然落到同一组。
    group: release-${{ github.ref_name }}
    cancel-in-progress: false

env:
    CARGO_TERM_COLOR: always

jobs:
    guard:
        name: 🔍 发布前校验
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            version: ${{ steps.ver.outputs.version }}
            date: ${{ steps.ver.outputs.date }}
            tag: ${{ steps.ver.outputs.tag }}
        steps:
            # 必须先钉住触发来源：push 只会在 tag 上触发，但 workflow_dispatch 可以在
            # 任意分支上误点。这里先拦一道，10 秒内给出正确用法，而不是拿着分支名
            # 去猜版本、或者在 guard 末尾才因为格式不符报一个看不懂的错。
            - name: 校验触发来源是 tag
              run: |
                  if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
                    echo "::error::本流水线必须在 tag 上运行（当前 ref_type=${GITHUB_REF_TYPE}，ref=${GITHUB_REF}）"
                    echo "::error::手动运行请把 tag 指定为 ref：gh workflow run release.yml --ref V0.5.0.20261104"
                    exit 1
                  fi
                  echo "运行 ref：${GITHUB_REF_NAME}（tag）"

            # 不写 ref：默认检出触发用的那个 ref，也就是这个 tag 本身。
            - name: 检出 tag 提交
              uses: actions/checkout@v7
              with:
                  # merge-base 对比 origin/main 需要完整历史
                  fetch-depth: 0

            - name: 解析 tag 与版本号
              id: ver
              run: |
                  TAG="${GITHUB_REF_NAME}"
                  # 五位版本 V主.副.修订.日期：去掉 V 前缀与最后一段，即 Cargo 版本。
                  CORE="${TAG#V}"
                  CORE="${CORE%.*}"
                  {
                    echo "tag=$TAG"
                    echo "version=$CORE"
                    echo "date=${TAG##*.}"
                  } >> "$GITHUB_OUTPUT"
                  echo "构建 $TAG（Cargo 版本 $CORE，日期位 ${TAG##*.}）"

            - name: 校验 tag 格式，且与 Cargo.toml / Cargo.lock / version.rs 一致
              run: |
                  TAG="${{ steps.ver.outputs.tag }}"
                  V="${{ steps.ver.outputs.version }}"
                  D="${{ steps.ver.outputs.date }}"
                  if ! printf '%s' "$TAG" | grep -Eq '^V[0-9]+\.[0-9]+\.[0-9]+\.[0-9]{8}$'; then
                    echo "::error::tag $TAG 不符合 V主.副.修订.YYYYMMDD 格式"; exit 1
                  fi
                  CARGO_V="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
                  if [ "$CARGO_V" != "$V" ]; then
                    echo "::error::Cargo.toml 版本 $CARGO_V 与 tag 前三段 ${V} 不一致"; exit 1
                  fi
                  # 锁文件版本没跟上时，--locked 构建会在几分钟后才失败；这里先拦下来。
                  LOCK_V="$(grep -A1 '^name = "sparrowpdf"$' Cargo.lock \
                    | sed -n 's/^version *= *"\(.*\)"/\1/p' | head -1)"
                  if [ "$LOCK_V" != "$V" ]; then
                    echo "::error::Cargo.lock 里 sparrowpdf 是 $LOCK_V，与 tag 前三段 ${V} 不一致（本地跑一次 cargo check 同步锁文件再提交）"; exit 1
                  fi
                  # 日期位是产品版本的一部分：tag 与源码里的日期不一致，装出来的
                  # 关于页就会和 tag 对不上，属于必须拦下的版本漂移。
                  SRC_D="$(sed -n 's/^pub const DATE: &str = "\(.*\)";$/\1/p' src/version.rs | head -1)"
                  if [ "$SRC_D" != "$D" ]; then
                    echo "::error::src/version.rs 的日期位 $SRC_D 与 tag 的 $D 不一致（发布当天更新 version.rs）"; exit 1
                  fi
                  # 发布页的「更新说明」直接取 CHANGELOG 里这一版的条目，缺了就没有
                  # 可发的内容；在这里拦下，省得等两个 runner 跑完才在 publish 报错。
                  if ! grep -qF "## [$TAG]" CHANGELOG.md; then
                    echo "::error::CHANGELOG.md 缺少 ## [$TAG] 条目（发布页的更新说明取自这里）"; exit 1
                  fi

            - name: 确认 tag 已合入 main
              run: |
                  git fetch origin main --quiet
                  if ! git merge-base --is-ancestor HEAD origin/main; then
                    echo "::error::当前提交不在 main 分支上"; exit 1
                  fi

            - name: 校验打包资源齐全
              run: |
                  MISSING=0
                  for f in assets/app.ico assets/app.icns; do
                    if [ ! -s "$f" ]; then
                      echo "::error::缺少打包资源 $f（Windows 图标由 build.rs 嵌入，macOS 图标由打包步骤复制）"
                      MISSING=1
                    fi
                  done
                  exit "$MISSING"

    build-windows:
        name: 🖥️ Windows ${{ matrix.arch }}
        needs: guard
        runs-on: windows-latest
        timeout-minutes: 60
        # 两个架构用矩阵而非复制 job：步骤完全一致，不会出现「新架构少校验一步」。
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: x64
                      rust_target: x86_64-pc-windows-msvc
                      asset: SparrowPDF-windows-x64.exe
                    - arch: arm64
                      rust_target: aarch64-pc-windows-msvc
                      asset: SparrowPDF-windows-arm64.exe
        steps:
            - name: 检出 tag 提交
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.guard.outputs.tag }}

            - name: 安装 Rust（固定 1.97.1）
              uses: dtolnay/rust-toolchain@1.97.1
              with:
                  # 版本由分支名决定，勿写 with.toolchain（未声明输入，只会触发警告）。
                  targets: ${{ matrix.rust_target }}

            - name: 缓存依赖
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  # runner.os 相同，两个矩阵任务必须用不同的键，否则互相覆盖。
                  key: ${{ runner.os }}-${{ matrix.arch }}-cargo-release-${{ hashFiles('Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-${{ matrix.arch }}-cargo-release-

            - name: 🔨 编译 release
              run: cargo build --release --locked --target ${{ matrix.rust_target }}

            - name: 🔎 校验清单、调试段与体积
              shell: pwsh
              run: |
                  $exe = "target/${{ matrix.rust_target }}/release/sparrowpdf.exe"
                  if (-not (Test-Path $exe)) { throw "找不到 exe" }
                  $bytes = [System.IO.File]::ReadAllBytes($exe)
                  # 整文件解码一次再查子串：逐字节比较在 12 MB 上要上亿次，
                  # 在 PowerShell 里要跑几十秒。
                  $text = [System.Text.Encoding]::ASCII.GetString($bytes)
                  if ($text.Contains(".debug_")) {
                    throw "release exe 里仍有 .debug_ 段（检查 Cargo.toml 的 strip 配置）"
                  }
                  # 提权清单是产品的既定行为：写受保护目录依赖它。build.rs 或
                  # 构建方式一变就可能被静默丢掉，包会悄悄降权。
                  if (-not $text.Contains("requireAdministrator")) {
                    throw "exe 缺少 requireAdministrator 清单（检查 build.rs 的 winresource 配置）"
                  }
                  $mb = [math]::Round($bytes.Length / 1MB, 2)
                  if ($bytes.Length -gt 20MB) { throw "exe 为 $mb MB，超过 20 MB 上限（UPX 前）" }
                  Write-Host "exe 正常：$mb MB，无调试段，清单完整"

            # UPX 自 5.x 起带 p_w64pe_arm64，两个架构都能压，配置保持一致；
            # 万一某个架构压不了，continue-on-error 也不会拦住发布。
            - name: 🗜️ UPX 压缩（失败不中断）
              continue-on-error: true
              shell: pwsh
              run: |
                  $exe = "target/${{ matrix.rust_target }}/release/sparrowpdf.exe"
                  Copy-Item $exe upx-input.exe -Force
                  curl.exe -fsSL -o upx.zip https://github.com/upx/upx/releases/download/v5.3.0/upx-5.3.0-win64.zip
                  Expand-Archive upx.zip -DestinationPath upx -Force
                  & (Get-ChildItem upx -Recurse -Filter upx.exe).FullName --best $exe
                  # UPX 会重写节表与资源目录；万一它吃掉 RT_MANIFEST，exe 就不再请求
                  # 管理员权限。这种概率很低，但代价是产品行为变了，所以压缩后复查，
                  # 丢清单就回退到未压缩版本（本步骤 continue-on-error，不会拦住发布）。
                  $after = [System.IO.File]::ReadAllBytes($exe)
                  if (-not [System.Text.Encoding]::ASCII.GetString($after).Contains("requireAdministrator")) {
                    Write-Warning "UPX 后清单丢失，回退到未压缩版本"
                    Copy-Item upx-input.exe $exe -Force
                  }
                  $sz = (Get-Item $exe).Length
                  if ($sz -gt 12MB) { Write-Warning "UPX 后为 $([math]::Round($sz/1MB,2)) MB，超过 12 MB 目标" }
                  Remove-Item upx-input.exe, upx.zip -Force -Recurse

            # 两个架构的 exe 同名（都叫 sparrowpdf.exe），直接上传会在 publish 里
            # merge-multiple 到同一个 dist/ 目录、互相覆盖。先按架构重命名，产物
            # 名即 Release 附件名，下载页上一眼能分清 x64 与 arm64。
            - name: 重命名产物
              shell: pwsh
              run: |
                  $src = "target/${{ matrix.rust_target }}/release/sparrowpdf.exe"
                  Copy-Item $src "${{ matrix.asset }}" -Force
                  Write-Host "产物：${{ matrix.asset }}（$([math]::Round((Get-Item "${{ matrix.asset }}").Length/1MB,2)) MB）"

            - name: 上传构建产物
              uses: actions/upload-artifact@v7
              with:
                  name: SparrowPDF-windows-${{ matrix.arch }}
                  path: ${{ matrix.asset }}
                  if-no-files-found: error

    build-macos:
        name: 💻 macOS 通用版（arm64 + x86_64）
        needs: guard
        runs-on: macos-latest
        timeout-minutes: 60
        env:
            # 显式声明部署目标，与 Info.plist 的 LSMinimumSystemVersion 对齐。
            # 不写的话下限由 runner 上的 SDK 决定：镜像一升级就可能把产物抬到
            # 新系统，CI 全绿、用户装到旧 Mac 上起不来。
            MACOSX_DEPLOYMENT_TARGET: "11.0"
        steps:
            - name: 检出 tag 提交
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.guard.outputs.tag }}

            - name: 安装 Rust（固定 1.97.1）
              uses: dtolnay/rust-toolchain@1.97.1
              with:
                  # 同上：版本来自分支名，不要写 with.toolchain。
                  targets: aarch64-apple-darwin,x86_64-apple-darwin

            # 免费版没有 runner 优先级，macOS 又是排队最久的池子。把 runner 的
            # 真实身份（镜像版本、CPU 架构、Xcode、rustc）打进日志：出问题时能
            # 一眼分清是镜像变了、架构不对，还是单纯排队。
            - name: 🩺 运行环境自检
              run: |
                  sw_vers
                  echo "架构：$(uname -m)"
                  xcodebuild -version
                  rustc -vV
                  echo "部署目标：$MACOSX_DEPLOYMENT_TARGET"

            - name: 缓存依赖
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-universal-cargo-release-${{ hashFiles('Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-universal-cargo-release-

            # 不单独 strip：Cargo.toml 的 [profile.release] strip = true 已在
            # 链接期完成剥离，Windows 侧同样只依赖这一设置。
            - name: 🔨 编译 arm64 与 x86_64
              run: |
                  cargo build --release --locked --target aarch64-apple-darwin
                  cargo build --release --locked --target x86_64-apple-darwin

            - name: 合并为通用二进制
              run: |
                  mkdir -p universal
                  lipo -create \
                    target/aarch64-apple-darwin/release/sparrowpdf \
                    target/x86_64-apple-darwin/release/sparrowpdf \
                    -output universal/SparrowPDF
                  ARCHS="$(lipo -archs universal/SparrowPDF)"
                  echo "架构：$ARCHS"
                  case "$ARCHS" in *x86_64*) ;; *) echo "::error::缺少 x86_64 架构"; exit 1;; esac
                  case "$ARCHS" in *arm64*) ;; *) echo "::error::缺少 arm64 架构"; exit 1;; esac
                  SZ=$(stat -f%z universal/SparrowPDF)
                  if [ "$SZ" -gt $((25 * 1024 * 1024)) ]; then
                    echo "::error::通用二进制 $SZ 字节，超过 25 MB 上限"; exit 1
                  fi

            - name: 打包 SparrowPDF.app
              run: |
                  V="${{ needs.guard.outputs.version }}"
                  # CFBundleVersion 用日期位当 build 号（Apple 建议单调递增的整数），
                  # 对外展示的短版本仍是三段核心版本；完整五位版本在应用「关于」页。
                  D="${{ needs.guard.outputs.date }}"
                  APP="SparrowPDF.app"
                  mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
                  cp universal/SparrowPDF "$APP/Contents/MacOS/SparrowPDF"
                  cp assets/app.icns "$APP/Contents/Resources/app.icns"
                  cat > "$APP/Contents/Info.plist" <<PLIST
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                  <dict>
                    <key>CFBundleName</key><string>轻雀 PDF</string>
                    <key>CFBundleDisplayName</key><string>轻雀 PDF</string>
                    <key>CFBundleExecutable</key><string>SparrowPDF</string>
                    <key>CFBundleIconFile</key><string>app</string>
                    <key>CFBundleIdentifier</key><string>com.sparrowpdf.app</string>
                    <key>CFBundleVersion</key><string>$D</string>
                    <key>CFBundleShortVersionString</key><string>$V</string>
                    <key>CFBundlePackageType</key><string>APPL</string>
                    <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
                    <key>LSMinimumSystemVersion</key><string>11.0</string>
                    <key>NSHighResolutionCapable</key><true/>
                    <key>NSPrincipalClass</key><string>NSApplication</string>
                    <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
                    <key>CFBundleDocumentTypes</key>
                    <array>
                      <dict>
                        <key>CFBundleTypeName</key><string>PDF Document</string>
                        <key>CFBundleTypeRole</key><string>Editor</string>
                        <key>LSItemContentTypes</key>
                        <array><string>com.adobe.pdf</string></array>
                      </dict>
                    </array>
                  </dict>
                  </plist>
                  PLIST
                  # ad-hoc 签名：没有 Developer ID 也能让 Gatekeeper 放行本地
                  # 构建；对外分发仍需真正的证书与公证。
                  # 签完立刻验：签名步骤成功不代表产物能通过校验，坏包发出去
                  # 就是「已损坏，无法打开」，而 CI 只会显示绿勾。
                  codesign --force --sign - "$APP"
                  codesign --verify --deep --strict --verbose=2 "$APP"
                  # 用 sed 而不是 head：head 提前关管道会让 codesign 收到 SIGPIPE，
                  # 在 pipefail 下这一步就会假失败。
                  codesign -dv "$APP" 2>&1 | sed -n '1,6p'

            - name: 💿 制作 DMG
              run: |
                  V="${{ needs.guard.outputs.version }}"
                  DMG="SparrowPDF-macos-universal.dmg"
                  rm -rf dmgsrc "$DMG"
                  mkdir -p dmgsrc
                  cp -R SparrowPDF.app dmgsrc/
                  # UDZO 只能配 HFS+。失败后用同名重试吸收偶发的 resource busy，
                  # 最后 hdiutil verify 校验镜像完整性。
                  create() {
                    hdiutil create -volname "SparrowPDF $V" -srcfolder dmgsrc \
                      -format UDZO -fs HFS+ -o "$DMG"
                  }
                  create || { sleep 3; rm -f "$DMG"; create; }
                  hdiutil verify "$DMG"
                  ls -la "$DMG"

            - name: 上传构建产物
              uses: actions/upload-artifact@v7
              with:
                  name: SparrowPDF-macos-universal
                  path: SparrowPDF-macos-universal.dmg
                  if-no-files-found: error

    publish:
        name: 🎉 发布 Release
        needs: [guard, build-windows, build-macos]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        # 只有这一步需要写权限（创建 / 更新 Release），其余 job 保持只读。
        permissions:
            contents: write
        steps:
            # 发布页的更新说明取自 CHANGELOG.md，所以要把 tag 上的这份文件取下来。
            - name: 检出 tag 提交
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.guard.outputs.tag }}

            - name: 下载构建产物
              uses: actions/download-artifact@v8
              with:
                  merge-multiple: true
                  path: dist

            # 三个附件来自三个不同的 artifact，靠 merge 落到同一个目录。先打印清单：
            # 少传/传错时能直接看出缺哪个平台，而不是只看到 release 里少一个文件。
            - name: 核对附件清单
              run: ls -la dist

            # 从 "## [V主.副.修订.YYYYMMDD] - 日期" 开始原样截取本版条目（含分类
            # 小标题），遇到下一个二级标题或文件末尾的链接定义区即停，末尾空行
            # 去掉。内容以人工撰写的 CHANGELOG 为准，不用 generate_release_notes
            # 的机器摘要。
            - name: 提取本版更新说明
              run: |
                  TAG="${{ needs.guard.outputs.tag }}"
                  awk -v h="## [$TAG]" '
                    index($0, h) == 1 { f = 1 }
                    f && /^## / && index($0, h) != 1 { exit }
                    f && /^\[[^]]+\]:/ { exit }
                    f { buf[++n] = $0 }
                    END {
                      while (n > 0 && buf[n] ~ /^[[:space:]]*$/) n--
                      for (i = 1; i <= n; i++) print buf[i]
                    }
                  ' CHANGELOG.md > release-notes.md
                  if [ ! -s release-notes.md ]; then
                    echo "::error::没能从 CHANGELOG.md 提取 ## [$TAG] 的内容"; exit 1
                  fi
                  echo "---- 发布说明（$(wc -l < release-notes.md) 行）----"
                  cat release-notes.md

            - name: 创建 GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ needs.guard.outputs.tag }}
                  name: 轻雀 PDF ${{ needs.guard.outputs.tag }}
                  body_path: release-notes.md
                  # 三个平台缺一不可：某个产物没上传时直接失败，避免发出一个
                  # 「看起来正常、实际只有两个平台」的 Release。
                  fail_on_unmatched_files: true
                  files: |
                      dist/SparrowPDF-windows-x64.exe
                      dist/SparrowPDF-windows-arm64.exe
                      dist/SparrowPDF-macos-universal.dmg
