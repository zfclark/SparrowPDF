# 轻雀 PDF 代码检查流水线
#
# 触发
#   · pull_request 指向 main 或 dev：跑质量门，结果作为 PR 的状态检查。
#   · push 到 dev：同一条门禁，防止「dev 直推后才发现编译不过」。
#   · 同一 PR / 分支有新提交时取消上一次运行，不排队等旧结果。
#   · 只做检查，不构建产物、不发 Release；发布由 release.yml 在 tag 上跑。
#
# 合并前置（仓库设置里一次性开启，见 AGENTS.md 4.6）
#   Settings → Rules / Branches → Require status checks to pass before merging，
#   勾选本文件的作业名「质量门（Windows）」。改作业名会让该设置失效。
#
# 维护约束见 AGENTS.md 4.4（质量门）与 4.6（代码检查与合并前置）。

name: 🔍 代码检查

on:
    pull_request:
        branches: [main, dev]
    push:
        branches: [dev]
        # 纯文档 / 依赖调度配置的提交不改变二进制，重跑一次完整质量门（约 1.5 分钟
        # runner 时间）没有任何信息量。PR 侧不设 paths-ignore：那会让必需检查永远
        # 不出现，反而卡住发版 PR。
        paths-ignore:
            - "**.md"
            - "docs/**"
            - "LICENSE"
            - ".github/dependabot.yml"
            - ".github/pull_request_template.md"
    # 在分支上手动跑一次，用于排查「本地绿、CI 红」。
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    # 按提交分组而不是按 PR 号：dev 直推与指向同一提交的发版 PR 是同一份代码，
    # 分两个组会白跑两遍；同组内后到的取消先到的，最终只留一次结果。
    group: pr-check-${{ github.event.pull_request.head.sha || github.sha }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always

jobs:
    quality-gate:
        # 这个名字就是 PR 上状态检查显示的名称，分支保护引用的也是它：
        # 改名必须同步改仓库设置，否则合并会一直等一个永远不会出现的检查。
        name: 质量门（Windows）
        runs-on: windows-latest
        timeout-minutes: 45
        steps:
            - name: 检出 PR 提交
              uses: actions/checkout@v7
              with:
                  # 只校验当前提交，不取历史；需要 merge-base 的只有发布流水线。
                  fetch-depth: 1

            - name: 安装 Rust（固定 1.97.1）
              uses: dtolnay/rust-toolchain@1.97.1
              with:
                  # 版本由分支名决定，勿写 with.toolchain（未声明输入，只会触发警告）。
                  targets: x86_64-pc-windows-msvc
                  # 该 action 默认只装 minimal profile：不写 components 就没有 clippy，
                  # `cargo clippy` 会直接以 exit 1 失败（而不是报「没有警告」）。
                  components: clippy

            - name: 缓存依赖
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  # 与 release.yml 的缓存键分开：发布侧按架构分键且会被 UPX 步骤
                  # 改动产物，混用容易命中一份不完整的 target。
                  key: ${{ runner.os }}-pr-cargo-release-${{ hashFiles('Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-pr-cargo-release-

            # clippy 同时完成类型检查，并把「未使用变量」这类警告升为错误，
            # 因此不必再单独跑一次 cargo check（多一趟编译，收益为零）。
            - name: 🧹 Clippy（类型检查 + 警告门）
              run: cargo clippy --release --all-targets --locked -- -D warnings

            # 依赖 PR 最常见的隐性破坏：直接依赖停在旧版本，而新升的传递依赖要新版本，
            # 锁文件里于是出现同一个 crate 的两份实现（PR #6：hayro-ccitt 0.4 与 0.5
            # 并存）。编译能过、体积白涨，两份实现的行为还可能不一致，所以单列一道门。
            # 只查直接依赖：传递依赖的重复多由上游互相锁版本造成，拦不住也不该拦。
            # 用 cargo tree 的文本输出而不是 cargo metadata 的 JSON：本包描述是中文，
            # 经 pwsh 解码容易变成乱码并让 JSON 解析失败。
            - name: 🧬 直接依赖版本唯一性
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"
                  # 已登记例外（原因见 AGENTS.md 4.7）：传递依赖把版本钉在不同大版本上，
                  # 与本项目的直接依赖无法合并，属上游事实而非疏漏。
                  $allowed = @("weezl", "windows-sys")

                  # 第一层即直接依赖，首行是本包自身。
                  $direct = @{}
                  $root = $true
                  foreach ($line in (cargo tree --depth 1 --prefix none --edges normal,build,dev)) {
                      if ($root) { $root = $false; continue }
                      if ($line -match '^([A-Za-z0-9][A-Za-z0-9_-]*) v[0-9]') { $direct[$matches[1]] = $true }
                  }

                  # 出现两份及以上实现的 crate。
                  $dup = @{}
                  foreach ($line in (cargo tree -d)) {
                      if ($line -match '^([A-Za-z0-9][A-Za-z0-9_-]*) v[0-9]') { $dup[$matches[1]] = $true }
                  }

                  $bad = @()
                  foreach ($name in ($dup.Keys | Sort-Object)) {
                      if ($direct.ContainsKey($name) -and $allowed -notcontains $name) { $bad += $name }
                  }
                  if ($bad.Count -gt 0) {
                      foreach ($name in $bad) { Write-Host "::error::直接依赖 $name 出现多个版本" }
                      Write-Host "::error::把直接依赖提到统一版本再合并；确有必要例外时，写明原因并在本步骤与 AGENTS.md 4.7 同时登记。"
                      exit 1
                  }
                  Write-Host "通过：$($direct.Count) 个直接依赖均只有一个版本（例外 $($allowed -join '、')）。"

            # 依赖漏洞：lopdf 那次 HIGH 若有这一步，半年前就会红在 CI 里。
            # 只对「漏洞」失败；uncategorized/unmaintained 类告警（如 paste、ttf-parser
            # 已停止维护）只打印，不阻塞——它们没有可升级的目标版本。
            - name: 安装 cargo-audit
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-audit

            - name: 🛡️ 依赖漏洞扫描
              run: cargo audit

            # --test-threads=1：多数用例共用同一个目标临时目录与日志文件，并发跑
            # 会偶发抢写（AGENTS.md 4.3）。串行只多花几秒，换来确定的结果。
            - name: 🧪 集成测试
              run: cargo test --release --lib --test integration --locked -- --test-threads=1
